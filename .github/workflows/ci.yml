# Quality gate: every push and pull request must install, lint, format-check and type-check.
name: CI

on:
  push:
  pull_request:
    branches: [master]

jobs:
  quality:
    name: Lint, format and type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # Reads the exact pnpm version from "packageManager" in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile fails if pnpm-lock.yaml is out of date.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck
