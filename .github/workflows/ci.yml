# Quality gate: every push and pull request must install, lint, format-check,
# type-check and test against a real Postgres.
name: CI

on:
  push:
  pull_request:
    branches: [master]

jobs:
  quality:
    name: Lint, format, type check and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dtp
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: dhaka_tesla_pool_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://dtp:test_password@localhost:5432/dhaka_tesla_pool_test
      JWT_SECRET: ci_test_secret_1234567890
      COOKIE_SECURE: "false"
      NODE_ENV: test

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test
